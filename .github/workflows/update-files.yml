name: Update TVBox Files

on:
  schedule:
    # 每周一 UTC 00:00 运行 (对应北京时间周一 08:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 允许手动触发，方便测试

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 授予写入权限，以便推送提交

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，避免推送时出错

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run download script
        run: python download_files.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查是否有文件变更，避免无变更时的空提交报错
          if git diff --quiet && git diff --cached --quiet; then
            echo "没有文件变更，跳过提交。"
            exit 0
          fi
          
          git add fty.json jar/fan.txt
          git commit -m "Auto-update fty.json and jar/fan.txt"
          git push