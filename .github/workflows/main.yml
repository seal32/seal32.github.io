name: Update IPTV Schedule

on:
  schedule:
    - cron: '0 0 * * 1'  # 分、时、天 、月、星期。每周一0点运行 (1-6表示周一到周六, 0/7是周日)
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  run_script:
    runs-on: ubuntu-latest  # 使用最新的Ubuntu运行器
    continue-on-error: true

    # 强制所有 JavaScript Actions 使用 Node.js 24 运行（规避 Node 20 弃用问题）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Shanghai  # 设置时区为上海

    steps:
    - name: Checkout repository  # 检出代码库
      uses: actions/checkout@v4

    - name: Set up Python  # 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'  # 使用最新Python 版本

    - name: Cache dependencies  # 缓存pip依赖项
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies  # 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies  # 安装Python依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests aiohttp

    - name: Install dependencies  # 安装demjson3
      run: |
        python -m pip install --upgrade pip
        pip install demjson3

    - name: Run Python script  # 执行主脚本
      run: |
        python main.py

    - name: Commit and push if changed  # 如果有更改，则提交并推送
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update live files"
          git pull --rebase
          git push
        fi